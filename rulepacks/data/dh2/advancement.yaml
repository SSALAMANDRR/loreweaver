version: 1

# Dark Heresy Second Edition, Russian OKP translation v1.8, Chapter II,
# Step 4 (spending XP). Costs come from tables 2-2, 2-4 and 2-6; the
# characteristic/skill aptitude pairs come from tables 2-3 and 2-5.
# New characters receive 1000 XP to spend during creation.
starting_xp: 1000
aptitude_field: Aptitudes
# Every DH2 character has the General aptitude regardless of creation choices.
base_aptitudes: [Общая]

costs:
  characteristic:
    simple:       {0: 500, 1: 250, 2: 100}
    intermediate: {0: 750, 1: 500, 2: 250}
    trained:      {0: 1000, 1: 750, 2: 500}
    proficient:   {0: 1500, 1: 1000, 2: 750}
    expert:       {0: 2500, 1: 1500, 2: 1250}

  skill:
    known:        {0: 300, 1: 200, 2: 100}
    trained:      {0: 600, 1: 400, 2: 200}
    experienced:  {0: 900, 1: 600, 2: 300}
    veteran:      {0: 1200, 1: 800, 2: 400}

  talent:
    tier_1:       {0: 600, 1: 300, 2: 200}
    tier_2:       {0: 900, 1: 450, 2: 300}
    tier_3:       {0: 1200, 1: 600, 2: 400}

# Influence is intentionally absent. Table 2-3 lists nine improvable
# characteristics and the rules explicitly state that Influence cannot be
# improved by spending XP.
requirements:
  characteristic:
    WS:  ["Навык Рукопашной", Нападение]
    BS:  ["Навык Стрельбы", Изящество]
    S:   [Сила, Нападение]
    T:   [Выносливость, Защита]
    Ag:  [Ловкость, Изящество]
    Int: [Интеллект, Познание]
    Per: [Восприятие, Полевое]
    WP:  ["Сила Воли", Псайкер]
    Fel: [Общительность, Общение]

  skill:
    Acrobatics:     [Ловкость, Общая]
    Athletics:      [Сила, Общая]
    Awareness:      [Восприятие, Полевое]
    Security:       [Интеллект, Техно]
    Survival:       [Восприятие, Полевое]
    Inquiry:        [Общительность, Общение]
    Interrogation:  ["Сила Воли", Общение]
    ForbiddenLore:  [Интеллект, Познание]
    Intimidate:     [Сила, Общение]
    Command:        [Общительность, Лидерство]
    Commerce:       [Интеллект, Познание]
    Linguistics:    [Интеллект, Общая]
    SleightOfHand:  [Ловкость, Познание]
    Logic:          [Интеллект, Познание]
    Medicae:        [Интеллект, Полевое]
    Navigation:     [Интеллект, Полевое]
    Charm:          [Общительность, Общение]
    Deceive:        [Общительность, Общение]
    CommonLore:     [Интеллект, Общая]
    Parry:          ["Навык Рукопашной", Защита]
    Scrutiny:       [Восприятие, Общая]
    Psyniscience:   [Восприятие, Псайкер]
    Trade:          [Интеллект, Общая]
    Stealth:        [Ловкость, Полевое]
    TechUse:        [Интеллект, Техно]
    Dodge:          [Ловкость, Защита]
    Operate:        [Ловкость, Полевое]
    ScholasticLore: [Интеллект, Познание]
