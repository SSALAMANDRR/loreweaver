version: 1

# Explicit player-facing order for Dark Heresy Second Edition character
# creation. Core only understands generic stage kinds and never branches on DH2.
# After the initial profile rolls the player may make the rules-granted one-shot
# characteristic reroll; its second result is mandatory. The home-world layer
# then reuses the selected profile so characteristic generation and the
# non-characteristic home-world benefits cannot diverge. Background/role
# aptitude collisions stay unresolved until all seven starting aptitudes are
# known, then the player replaces every duplicate before starting XP is exposed.
stages:
  - id: characteristics
    kind: profile

  - id: characteristic_reroll
    kind: profile_reroll

  - id: home_world
    kind: layer
    layer: home_world
    option_from_profile: true

  - id: background
    kind: layer
    layer: background
    defer_duplicates: true

  - id: role
    kind: layer
    layer: role
    defer_duplicates: true

  - id: duplicate_aptitudes
    kind: duplicates

  - id: advancement
    kind: advancement

  - id: starting_equipment
    kind: starting_equipment
