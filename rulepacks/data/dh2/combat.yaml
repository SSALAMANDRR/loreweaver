version: 1
presentation:
  actions:
    ranged_attack: {en: Ranged attack, ru: Дистанционная атака, zh: 远程攻击}
    melee_attack: {en: Melee attack, ru: Ближняя атака, zh: 近战攻击}
    aim: {en: Aim, ru: Прицелиться, zh: 瞄准}
    reload: {en: Reload, ru: Перезарядить, zh: 装弹}
  modes:
    single: {en: Single, ru: Одиночный, zh: 单发}
    semi: {en: Semi-auto, ru: Полуавтоматический, zh: 半自动}
    full: {en: Full-auto, ru: Автоматический, zh: 全自动}
    half: {en: Half action, ru: Полудействие, zh: 半动作}
  reactions:
    dodge: {en: Dodge, ru: Уклонение, zh: 闪避}
    parry: {en: Parry, ru: Парирование, zh: 格挡}
  locations:
    head: {en: Head, ru: Голова, zh: 头部}
    right_arm: {en: Right arm, ru: Правая рука, zh: 右臂}
    left_arm: {en: Left arm, ru: Левая рука, zh: 左臂}
    body: {en: Body, ru: Корпус, zh: 躯干}
    right_leg: {en: Right leg, ru: Правая нога, zh: 右腿}
    left_leg: {en: Left leg, ru: Левая нога, zh: 左腿}
# One half action costs 1, one full action costs 2 (a full action excludes half actions).
turn_state:
  action_budget_per_turn: 2
  reactions_per_round: 1
  reaction_reset: round
  # Two half actions in one turn must be different actions.
  distinct_actions_per_turn: true
  # At most one Attack-subtype and one Concentration-subtype action per turn.
  subtype_limits_per_turn: {attack: 1, concentration: 1}
  # Evasion happens after the hit is established and before damage is rolled.
  reaction_window: before_damage
  aim_lost_on_reaction: true
initiative:
  # Roll expression: rulepacks/dh2.yaml `initiative.roll` (1d10 + Agility Bonus).
  order: descending
  tie_breakers:
    - {value: Ag}
    # The source does not say what happens when the 1d10 roll-off ties again;
    # repeating it is our policy (see provenance.implementation_choices).
    - {roll: 1d10, repeat_on_tie: true}
margin_unit: degrees
actions:
  ranged_attack:
    modes:
      single:
        action_cost: 1
        subtypes: [attack]
        # Standard Attack is an Ordinary (+10) test.
        attack_modifier: 10
        attack_value: BS
        damage_value: Damage
        toughness_value: TB
        weapon_profiles: [lasgun, autogun, laspistol]
        consumes_ammo: true
        reactions:
          basic: {cost: 1, spend_on: attempt}
          dodge: {cost: 1, spend_on: attempt, target_value: DodgeTarget, hits_avoided_per_degree: 1}
      semi:
        action_cost: 2
        attack_value: BS
        damage_value: Damage
        toughness_value: TB
        weapon_profiles: [lasgun, autogun]
        consumes_ammo: true
        extra_hit_degrees: 2
        reactions:
          dodge: {cost: 1, spend_on: attempt, target_value: DodgeTarget, hits_avoided_per_degree: 1}
      full:
        action_cost: 2
        attack_value: BS
        damage_value: Damage
        toughness_value: TB
        attack_modifier: -10
        weapon_profiles: [autogun]
        consumes_ammo: true
        extra_hit_degrees: 1
        reactions:
          dodge: {cost: 1, spend_on: attempt, target_value: DodgeTarget, hits_avoided_per_degree: 1}
  melee_attack:
    modes:
      single:
        action_cost: 1
        subtypes: [attack]
        # Standard Attack is an Ordinary (+10) test.
        attack_modifier: 10
        attack_value: WS
        damage_value: Damage
        toughness_value: TB
        damage_bonus_value: SB
        weapon_profiles: [sword, knife]
        consumes_ammo: false
        reactions:
          parry: {cost: 1, spend_on: attempt, target_value: ParryTarget}
          dodge: {cost: 1, spend_on: attempt, target_value: DodgeTarget, hits_avoided_per_degree: 1}
  aim:
    modes:
      half: {action_cost: 1, attack_modifier: 10, subtypes: [concentration]}
      full: {action_cost: 2, attack_modifier: 20, subtypes: [concentration]}
  reload:
    modes:
      full: {action_cost: 2, subtypes: [misc]}
# Rule sources: section keys of rule source DH2_RU_OKP_V1_8 (docs/dh2-port.md).
# null = the value is a local MVP contract not yet verified against the source.
provenance:
  action_economy: [CH07_H013, CH07_H014, CH07_H019]
  distinct_actions_per_turn: [CH07_H014, CH07_H019]
  subtype_limits_per_turn: CH07_H019
  action_subtypes: [CH07_H051, CH07_H021, CH07_H046]
  standard_attack_modifier: CH07_H051
  reaction_economy: CH07_H015
  reaction_outside_own_turn: [CH07_H015, CH07_H019, CH07_H029]
  reaction_window: [CH07_H029, CH07_H061]
  reaction_choices: CH07_H029
  aim_modifiers: CH07_H021
  aim_lost_on_reaction: CH07_H021
  initiative_roll: CH07_H011
  initiative_tie_breakers: CH07_H011
  turn_order: [CH07_H002, CH07_H003, CH07_H008, CH07_H009, CH07_H011]
  range_modifiers: null
  fire_mode_modifiers: null
  extra_hit_locations: null
  # Engine policies for edge cases the source leaves unspecified — NOT canon.
  implementation_choices:
    initiative_roll_off_repeat: "CH07_H011 orders a 1d10 roll-off for equal initiative and Agility but is silent on a repeated tie; the still-tied combatants roll again."
hit_locations:
  - {max: 10, id: head}
  - {max: 20, id: right_arm}
  - {max: 30, id: left_arm}
  - {max: 70, id: body}
  - {max: 85, id: right_leg}
  - {max: 100, id: left_leg}
hit_location_roll: reverse_digits
range_bands:
  - {max_distance: 2, modifier: 30}
  - {max_multiple: 0.5, modifier: 10}
  - {max_multiple: 2, modifier: 0}
  - {max_multiple: 3, modifier: -10}
  - {max_multiple: 4, modifier: -30}
