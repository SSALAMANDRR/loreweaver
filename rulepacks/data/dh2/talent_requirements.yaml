version: 1
talent_field: Talents
source: "Dark Heresy Second Edition RU OKP v1.8, Chapter IV tables 4-1 to 4-3 and talent descriptions. Human prerequisite prose is represented only where it maps deterministically to existing sheet state. A bare Chapter IV 'psy rating' prerequisite is represented by owning the Psyker elite advance, whose immediate changes grant Psy Rating 1. Cybernetic prerequisites use the canonical Chapter V equipment titles."

requirements:
