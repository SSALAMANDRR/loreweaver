# Dark Heresy Second Edition — deterministic mechanics kernel.
#
# Source of truth for this port is the structured Russian DH2 corpus migrated
# into the НРИ ВАХА Neon database from DH2_RU_OKP_V1_8. This slice covers
# characteristic naming/bonuses, the basic percentile check, the complete
# difficulty ladder, signed degrees of success/failure, initiative, the first
# rule-backed character-sheet resources, all 21 regular skills, and the seven
# Special skill families with separately trained specializations.
# Character creation, combat actions, hit locations, weapons and critical
# effects are added only after their source sections are mapped and tested.

names:
  - dh2
  - darkheresy2
  - "dark heresy 2e"
  - "dark heresy second edition"
  - "тёмная ересь 2"
  - "темная ересь 2"
set_keys: [dh2, darkheresy2]

# Missing characteristic values intentionally fall back to the legal floor,
# not to a fabricated "average acolyte". Real creation defaults belong to the
# character-creation slice and will replace these once Chapter II is ported.
#
# Regular skill values are TRAINING LEVELS, not check targets:
#   0 = untrained (-20), 1 = known (+0), 2 = trained (+10),
#   3 = experienced (+20), 4 = veteran (+30).
# Special skills use the same 1..4 trained ladder but rank 0 is forbidden.
