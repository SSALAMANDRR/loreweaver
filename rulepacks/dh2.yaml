expertise:
  ru: "# Dark Heresy Second Edition — Ведущий\nИспользуй процентные проверки DH2: бросок d100 должен быть не выше модифицированного значения характеристики или умения. Сложность меняет целевое значение по шкале от +60 до -60. Положительный margin — степени успеха, отрицательный — степени провала. Для обычных умений храни уровень обучения 0–4: нетренированное -20, Знает +0, Обучен +10, Опытен +20, Ветеран +30. Для Специальных умений каждая специализация хранится и развивается отдельно; без приобретённой специализации проверка невозможна. Раны являются порогом, а полученный Урон накапливается отдельно. Порог Усталости равен сумме бонусов Выносливости и Силы Воли. Механику, уже выраженную rulepack-ом, не пересчитывай в прозе и не подменяй результат броска повествованием."
  en: "# Dark Heresy Second Edition — GM\nUse DH2 percentile checks: d100 must roll at or below the modified characteristic or skill. Difficulty changes the target on the +60 to -60 ladder. Positive margin is degrees of success; negative margin is degrees of failure. Regular skills store training level 0–4: untrained -20, known +0, trained +10, experienced +20, veteran +30. Every Special-skill specialization is stored and advanced separately, and a specialization cannot be checked before it is acquired. Wounds are a threshold while accrued Damage is tracked separately. Fatigue Threshold equals Toughness Bonus plus Willpower Bonus. Do not recompute mechanics already owned by the rulepack in prose or override a rolled result with narration."

