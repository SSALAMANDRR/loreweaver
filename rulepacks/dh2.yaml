# CH01_M03/CH01_M04 + CH01_H018: roll d100 and succeed on a result no greater
# than the modified characteristic/skill. DH2 permits effective targets above
# 100 and below 0, so target transforms are intentionally not clamped here.
#
# CH01_H022: a successful check starts at 1 degree of success and gains one for
# every full 10 points by which target exceeds the roll; failures mirror this.
# Loreweaver's generic `margin` is the system-defined signed comparison metric,
# so positive values are DoS and negative values are DoF.
resolution:
  version: 1
  roll: 1d100
  target: skill
  compare: "<="
  margin: "(2 * (roll <= target) - 1) * (1 + floor(abs(target - roll) / 10))"
  difficulties:
    trivial:
      target: "target + 60"
      prefixes: {ru: [тривиальная, тривиально], en: [trivial]}
    elementary:
      target: "target + 50"
      prefixes: {ru: [элементарная, элементарно], en: [elementary]}
    simple:
      target: "target + 40"
      prefixes: {ru: [простая, просто], en: [simple]}
    easy:
      target: "target + 30"
      prefixes: {ru: [лёгкая, легко], en: [easy]}
    routine:
      target: "target + 20"
      prefixes: {ru: [обыденная, обыденно], en: [routine]}
    ordinary:
      target: "target + 10"
      prefixes: {ru: [ординарная, ординарно], en: [ordinary]}
    challenging:
      prefixes: {ru: [серьёзная, серьёзно], en: [challenging]}
    difficult:
      target: "target - 10"
      prefixes: {ru: [сложная, сложно], en: [difficult]}
    hard:
      target: "target - 20"
      prefixes: {ru: [тяжёлая, тяжело], en: [hard]}
    very_hard:
      target: "target - 30"
      prefixes: {ru: ["очень тяжёлая", "очень тяжело"], en: ["very hard"]}
    strenuous:
      target: "target - 40"
      prefixes: {ru: [напряжённая, напряжённо], en: [strenuous]}
    punishing:
      target: "target - 50"
      prefixes: {ru: [мучительная, мучительно], en: [punishing]}
    hellish:
      target: "target - 60"
      prefixes: {ru: [адская, адски], en: [hellish]}
  ranks:
    - {id: success, when: "roll <= target", success: true, tier: 2}
    - {id: fail, tier: 1}

labels:
  ru:
    success: {display: Успех, markers: []}
    fail: {display: Провал, markers: []}
  en:
    success: {display: Success, markers: []}
    fail: {display: Failure, markers: []}

# CH01_H003: every characteristic bonus is the tens digit of the value.
# CH07_H103: fatigue threshold = Toughness Bonus + Willpower Bonus.
# CH03_H001/H014/H015/H037: a regular skill check uses its base characteristic
# plus the modifier from its highest training level. The stored skill rank is
# kept separate from the derived check target, so advancement remains explicit.
derived:
  WSB: {expr: "floor(WS / 10)"}
  BSB: {expr: "floor(BS / 10)"}
  SB: {expr: "floor(S / 10)"}
  TB: {expr: "floor(T / 10)"}
  AgB: {expr: "floor(Ag / 10)"}
  IntB: {expr: "floor(Int / 10)"}
  PerB: {expr: "floor(Per / 10)"}
  WPB: {expr: "floor(WP / 10)"}
  FelB: {expr: "floor(Fel / 10)"}
  InfB: {expr: "floor(Inf / 10)"}
  FatigueThreshold: {expr: "TB + WPB"}
  AcrobaticsTarget: {expr: "Ag + if(Acrobatics == 0, -20, (Acrobatics - 1) * 10)"}
  AthleticsTarget: {expr: "S + if(Athletics == 0, -20, (Athletics - 1) * 10)"}
  AwarenessTarget: {expr: "Per + if(Awareness == 0, -20, (Awareness - 1) * 10)"}
  SecurityTarget: {expr: "Int + if(Security == 0, -20, (Security - 1) * 10)"}
  SurvivalTarget: {expr: "Per + if(Survival == 0, -20, (Survival - 1) * 10)"}
  InquiryTarget: {expr: "Fel + if(Inquiry == 0, -20, (Inquiry - 1) * 10)"}
  InterrogationTarget: {expr: "WP + if(Interrogation == 0, -20, (Interrogation - 1) * 10)"}
  IntimidateTarget: {expr: "S + if(Intimidate == 0, -20, (Intimidate - 1) * 10)"}
  CommandTarget: {expr: "Fel + if(Command == 0, -20, (Command - 1) * 10)"}
  CommerceTarget: {expr: "Int + if(Commerce == 0, -20, (Commerce - 1) * 10)"}
  SleightOfHandTarget: {expr: "Ag + if(SleightOfHand == 0, -20, (SleightOfHand - 1) * 10)"}
  LogicTarget: {expr: "Int + if(Logic == 0, -20, (Logic - 1) * 10)"}
  MedicaeTarget: {expr: "Int + if(Medicae == 0, -20, (Medicae - 1) * 10)"}
  CharmTarget: {expr: "Fel + if(Charm == 0, -20, (Charm - 1) * 10)"}
  DeceiveTarget: {expr: "Fel + if(Deceive == 0, -20, (Deceive - 1) * 10)"}
  ParryTarget: {expr: "WS + if(Parry == 0, -20, (Parry - 1) * 10)"}
  ScrutinyTarget: {expr: "Per + if(Scrutiny == 0, -20, (Scrutiny - 1) * 10)"}
  PsyniscienceTarget: {expr: "Per + if(Psyniscience == 0, -20, (Psyniscience - 1) * 10)"}
  StealthTarget: {expr: "Ag + if(Stealth == 0, -20, (Stealth - 1) * 10)"}
  TechUseTarget: {expr: "Int + if(TechUse == 0, -20, (TechUse - 1) * 10)"}
  DodgeTarget: {expr: "Ag + if(Dodge == 0, -20, (Dodge - 1) * 10)"}

